name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck --severity=error bin/*.sh test/*.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check bin/ptnaFillCsvData.py

  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Perl::Critic
        run: sudo apt-get update && sudo apt-get install -y libperl-critic-perl
      - name: Perl::Critic (severity 5, skipping vendored htmldiff.pl)
        run: perlcritic --severity 5 --verbose 1 $(ls bin/*.pl | grep -v htmldiff.pl) modules test/*.pl
